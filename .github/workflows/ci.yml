name: CI (Lint & Test)

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: Ruff Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Check
        run: |
          ruff check --output-format=github .

      - name: Run Ruff Format Check
        run: |
          ruff format --check .

  test:
    name: Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Test Dependencies (Fast)
        run: |
          python -m pip install --upgrade pip
          pip install pytest lightgbm pandas numpy scikit-learn yfinance

      - name: Setup Data Directory from Example
        run: |
          cp -r data.example data

      - name: Run Pytest
        run: |
          pytest tests/ -v
